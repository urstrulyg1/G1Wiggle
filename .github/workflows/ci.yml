name: CI

on:
  push:
    branches: [main, master, "arena/**"]


concurrency:
  group: g1wiggle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false
  CI_NODE_VERSION: "22.12.0"

jobs:
  validate-pipeline:
    name: Validate Pipeline and Build Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
      - name: Verify Node and npm
        run: |
          node --version
          npm --version
          node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if (major !== 22 || minor < 12) process.exit(1)'
      - name: Install dependencies
        run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Validate build scripts
        shell: bash
        run: |
          test -x build.sh || chmod +x build.sh
          for flag in --mac --win --linux --x64 --arm64 --ia32 --armv7l --all-arch; do
            grep -F -- "$flag" build.sh
          done
      - name: Validate configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('electron-builder.json','utf8'));
          if (c.publish !== null) throw new Error('publish must remain null in CI');
          if (!c.appId || !c.productName) throw new Error('missing appId/productName');
          if (!c.mac.artifactName.includes('${arch}')) throw new Error('mac artifactName must include arch');
          if (!c.nsis.artifactName.includes('${arch}')) throw new Error('nsis artifactName must include arch');
          if (!c.linux.artifactName.includes('${arch}')) throw new Error('linux artifactName must include arch');
          if (c.nsis.oneClick !== false || c.nsis.perMachine !== false) throw new Error('unexpected NSIS installation mode');
          NODE
      - name: Run pipeline validator
        run: npm run pipeline:validate:verbose
      - name: Run all tests
        run: npm run test:all
      - name: Build web application
        run: npm run build
      - name: Validate Electron Builder CLI
        run: npx electron-builder --help
