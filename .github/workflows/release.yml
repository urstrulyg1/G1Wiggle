name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Run tests
        run: npm run test:all
      - name: Validate pipeline
        run: npm run pipeline:validate
      - name: Build web application
        run: npm run build

  release-macos:
    name: Release macOS
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build web application
        run: npm run build
      - name: Build macOS x64
        run: npx electron-builder --mac --x64 -p never --config electron-builder.json
      - name: Build macOS arm64
        run: npx electron-builder --mac --arm64 -p never --config electron-builder.json
      - name: Build macOS universal
        run: npx electron-builder --mac --universal -p never --config electron-builder.json
      - name: Purge intermediates
        shell: bash
        run: rm -f release/*.blockmap release/*.yml release/*.yaml release/*.zip; rm -rf release/*-unpacked
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G1Wiggle-release-macos
          path: release/*
          if-no-files-found: warn
          retention-days: 90

  release-windows:
    name: Release Windows
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build web application
        run: npm run build
      - name: Build Windows x64
        run: npx electron-builder --win --x64 -p never --config electron-builder.json
      - name: Build Windows ia32
        run: npx electron-builder --win --ia32 -p never --config electron-builder.json
      - name: Build Windows arm64
        run: npx electron-builder --win --arm64 -p never --config electron-builder.json
      - name: Purge intermediates
        shell: bash
        run: rm -f release/*.blockmap release/*.yml release/*.yaml release/*.zip; rm -rf release/*-unpacked
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G1Wiggle-release-windows
          path: release/*
          if-no-files-found: warn
          retention-days: 90

  release-linux:
    name: Release Linux
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            command: npx electron-builder --linux --x64 -p never --config electron-builder.json
          - runner: ubuntu-24.04-arm
            arch: arm64
            command: npx electron-builder --linux --arm64 -p never --config electron-builder.json
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate icons
        run: npm run icons
      - name: Build web application
        run: npm run build
      - name: Build Linux ${{ matrix.arch }}
        run: ${{ matrix.command }}
      - name: Purge intermediates
        shell: bash
        run: rm -f release/*.blockmap release/*.yml release/*.yaml release/*.zip; rm -rf release/*-unpacked
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: G1Wiggle-release-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: warn
          retention-days: 90

  release-summary:
    name: Publish GitHub Release
    needs: [release-macos, release-windows, release-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Show release artifacts
        run: find release-artifacts -type f -maxdepth 3 -print
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
