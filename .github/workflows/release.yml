name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.0.0
        type: string

concurrency:
  group: g1wiggle-release-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false
  CI_NODE_VERSION: "22.12.0"

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: \${{ env.CI_NODE_VERSION }}
          cache: npm
      - name: Verify Node and npm
        run: |
          node --version
          npm --version
          node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if (major !== 22 || minor < 12) process.exit(1)'
      - run: npm ci
      - run: npm run icons
      - run: npm run test:all
      - run: npm run build
      - run: npm run pipeline:validate:verbose

  release-build:
    name: Release \${{ matrix.os }} / \${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - { os: mac, arch: x64, runner: macos-15-intel, command: "npx electron-builder --mac --x64 -p never --config electron-builder.json", artifact: "G1Wiggle-*-x64.dmg" }
          - { os: mac, arch: arm64, runner: macos-latest, command: "npx electron-builder --mac --arm64 -p never --config electron-builder.json", artifact: "G1Wiggle-*-arm64.dmg" }
          - { os: mac, arch: universal, runner: macos-latest, command: "npx electron-builder --mac --universal -p never --config electron-builder.json", artifact: "G1Wiggle-*-universal.dmg" }
          - { os: win, arch: x64, runner: windows-latest, command: "npx electron-builder --win --x64 -p never --config electron-builder.json", artifact: "G1Wiggle-Setup-*-x64.exe" }
          - { os: win, arch: ia32, runner: windows-latest, command: "npx electron-builder --win --ia32 -p never --config electron-builder.json", artifact: "G1Wiggle-Setup-*-ia32.exe" }
          - { os: win, arch: arm64, runner: windows-11-arm, command: "npx electron-builder --win --arm64 -p never --config electron-builder.json", artifact: "G1Wiggle-Setup-*-arm64.exe" }
          - { os: linux, arch: x64, runner: ubuntu-latest, command: "npx electron-builder --linux --x64 -p never --config electron-builder.json", artifact: "G1Wiggle-*-x64.AppImage" }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, command: "npx electron-builder --linux --arm64 -p never --config electron-builder.json", artifact: "G1Wiggle-*-arm64.AppImage" }
          - { os: linux, arch: armv7l, runner: ubuntu-latest, command: "npx electron-builder --linux --armv7l -p never --config electron-builder.json", artifact: "G1Wiggle-*-armv7l.AppImage" }
    runs-on: \${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: \${{ env.CI_NODE_VERSION }}
          cache: npm
      - name: Read package version
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run icons
      - run: npm run build
      - name: Package release artifact
        shell: bash
        run: |
          rm -rf release
          \${{ matrix.command }}
      - name: Verify exact artifact
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/\${{ matrix.artifact }})
          if [ \${#files[@]} -ne 1 ]; then
            find release -maxdepth 2 -type f -printf '%p %s bytes\n'
            exit 1
          fi
          test -s "\${files[0]}"
          case "\${files[0]}" in *"\$APP_VERSION"*) ;; *) echo "Artifact version mismatch"; exit 1 ;; esac
      - name: Validate Linux AppImage
        if: \${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          artifact=(release/\${{ matrix.artifact }})
          file "\${artifact[0]}"
          case "\${{ matrix.arch }}" in
            x64) file "\${artifact[0]}" | grep -Eqi 'x86-64|x86_64|amd64'; chmod +x "\${artifact[0]}"; "\${artifact[0]}" --appimage-version; "\${artifact[0]}" --appimage-extract-and-run --version ;;
            arm64) file "\${artifact[0]}" | grep -Eqi 'aarch64|arm64'; chmod +x "\${artifact[0]}"; "\${artifact[0]}" --appimage-version; "\${artifact[0]}" --appimage-extract-and-run --version ;;
            armv7l) file "\${artifact[0]}" | grep -Eqi 'ARM';;
            *) exit 1 ;;
          esac
      - name: Validate macOS DMG
        if: \${{ matrix.os == 'mac' }}
        shell: bash
        run: |
          artifact=(release/\${{ matrix.artifact }})
          mount_point="$RUNNER_TEMP/g1wiggle-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "\${artifact[0]}" -mountpoint "$mount_point" -nobrowse -quiet
          test -x "$mount_point/G1Wiggle.app/Contents/MacOS/G1Wiggle"
          info=$(lipo -archs "$mount_point/G1Wiggle.app/Contents/MacOS/G1Wiggle")
          case "\${{ matrix.arch }}" in
            x64) echo "$info" | grep -qw x86_64 ;;
            arm64) echo "$info" | grep -qw arm64 ;;
            universal) echo "$info" | grep -qw x86_64 && echo "$info" | grep -qw arm64 ;;
            *) exit 1 ;;
          esac
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount_point/G1Wiggle.app/Contents/Info.plist")
          test "$plist_version" = "$APP_VERSION"
          "$mount_point/G1Wiggle.app/Contents/MacOS/G1Wiggle" --version
          hdiutil detach "$mount_point" -quiet
      - name: Validate Windows NSIS installation
        if: \${{ matrix.os == 'win' }}
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path 'release' -Filter '\${{ matrix.artifact }}' -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one installer, found $($installer.Count)" }
          & "$env:GITHUB_WORKSPACE/scripts/validate-windows-install.ps1" -InstallerPath $installer[0].FullName -ExpectedArchitecture '\${{ matrix.arch }}' -ExpectedVersion "$env:APP_VERSION" -ProductName 'G1Wiggle'
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: G1Wiggle-release-\${{ matrix.os }}-\${{ matrix.arch }}
          path: release/\${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 90

  release-summary:
    name: Publish GitHub Release
    if: \${{ always() && needs.release-build.result == 'success' }}
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: G1Wiggle-release-*
          merge-multiple: true
      - name: Verify complete release set
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-artifacts/*.dmg release-artifacts/*.exe release-artifacts/*.AppImage)
          test \${#files[@]} -eq 9
          for f in "\${files[@]}"; do test -s "$f"; done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
