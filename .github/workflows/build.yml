name: All Apps, All OS, All Arch

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: Target OS or architecture to validate
        required: true
        default: all
        type: choice
        options: [all, mac, win, linux, x64, arm64, ia32, universal]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm run test
      - name: Build web application
        run: npm run build
      - name: Validate Electron Builder
        run: npx electron-builder --help
      - name: Validate pipeline
        run: npm run pipeline:validate

  build-matrix:
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - os: mac
            arch: x64
            runner: macos-15-intel
            command: npx electron-builder --mac --x64 -p never --config electron-builder.json
            artifact: G1Wiggle-*-x64.dmg
          - os: mac
            arch: arm64
            runner: macos-latest
            command: npx electron-builder --mac --arm64 -p never --config electron-builder.json
            artifact: G1Wiggle-*-arm64.dmg
          - os: mac
            arch: universal
            runner: macos-latest
            command: npx electron-builder --mac --universal -p never --config electron-builder.json
            artifact: G1Wiggle-*-universal.dmg
          - os: win
            arch: x64
            runner: windows-latest
            command: npx electron-builder --win --x64 -p never --config electron-builder.json
            artifact: G1Wiggle-Setup-*-x64.exe
          - os: win
            arch: ia32
            runner: windows-latest
            command: npx electron-builder --win --ia32 -p never --config electron-builder.json
            artifact: G1Wiggle-Setup-*-ia32.exe
          - os: win
            arch: arm64
            runner: windows-11-arm
            command: npx electron-builder --win --arm64 -p never --config electron-builder.json
            artifact: G1Wiggle-Setup-*-arm64.exe
          - os: linux
            arch: x64
            runner: ubuntu-latest
            command: npx electron-builder --linux --x64 -p never --config electron-builder.json
            artifact: G1Wiggle-*-x64.AppImage
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            command: npx electron-builder --linux --arm64 -p never --config electron-builder.json
            artifact: G1Wiggle-*-arm64.AppImage
          - os: linux
            arch: armv7l
            runner: ubuntu-latest
            command: npx electron-builder --linux --armv7l -p never --config electron-builder.json
            artifact: G1Wiggle-*-armv7l.AppImage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Package application
        shell: bash
        run: |
          rm -rf release
          ${{ matrix.command }}
      - name: Validate Linux AppImage
        # armv7l is cross-packaged on an x64 runner and cannot be executed there
        if: ${{ matrix.os == 'linux' && matrix.arch != 'armv7l' }}
        timeout-minutes: 10
        shell: bash
        run: |
          label="Linux install check (${{ matrix.arch }})"
          fail() { echo "::error title=$label::$(printf '%s' "$1" | tail -c 3000 | tr '\n' '|')"; exit 1; }
          shopt -s nullglob
          files=(release/${{ matrix.artifact }})
          [ ${#files[@]} -eq 1 ] || fail "Expected exactly one AppImage, found ${#files[@]}: $(ls release)"
          artifact="${files[0]}"
          chmod +x "$artifact"
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; } || fail "Could not install xvfb"
          out=$("$artifact" --appimage-version 2>&1) || fail "AppImage runtime check failed: $out"
          out=$(xvfb-run -a "$artifact" --appimage-extract-and-run --no-sandbox --version 2>&1) || fail "G1Wiggle --version failed: $out"
          echo "::notice title=$label::G1Wiggle --version -> $(printf '%s' "$out" | tail -n 1)"

      - name: Validate macOS DMG installation
        if: ${{ matrix.os == 'mac' }}
        timeout-minutes: 10
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/${{ matrix.artifact }})
          test ${#files[@]} -eq 1
          mount_point="$RUNNER_TEMP/g1wiggle-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "${files[0]}" -mountpoint "$mount_point" -nobrowse -quiet
          test -d "$mount_point/G1Wiggle.app"
          test -x "$mount_point/G1Wiggle.app/Contents/MacOS/G1Wiggle"
          "$mount_point/G1Wiggle.app/Contents/MacOS/G1Wiggle" --version
          hdiutil detach "$mount_point" -quiet

      - name: Validate Windows NSIS installation
        if: ${{ matrix.os == 'win' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = 'Windows install check (${{ matrix.arch }})'
          function Fail([string]$msg) {
            $msg = ($msg -replace '%', '%25') -replace "`r?`n", ' | '
            Write-Output "::error title=${label}::$msg"
            exit 1
          }
          try {
            $files = @(Get-ChildItem -Path 'release' -Filter '${{ matrix.artifact }}' -File)
            if ($files.Count -ne 1) { Fail "Expected exactly one installer, found $($files.Count): $((Get-ChildItem release -Name) -join ', ')" }
            $target = Join-Path $env:RUNNER_TEMP 'G1Wiggle-install'
            Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
            $installer = Start-Process -FilePath $files[0].FullName -ArgumentList '/S',('/D='+$target) -Wait -PassThru
            if ($installer.ExitCode -ne 0) { Fail "Installer $($files[0].Name) exited with code $($installer.ExitCode)" }
            $exe = Join-Path $target 'G1Wiggle.exe'
            if (!(Test-Path $exe)) {
              $listing = if (Test-Path $target) { (Get-ChildItem $target -Name) -join ', ' } else { '<install dir missing>' }
              $elsewhere = (@(Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter 'G1Wiggle.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName) -join ', ')
              Fail "G1Wiggle.exe not found in $target. Contents: $listing. Found elsewhere: $elsewhere"
            }
            $stdout = Join-Path $env:RUNNER_TEMP 'g1wiggle-version.out'
            $stderr = Join-Path $env:RUNNER_TEMP 'g1wiggle-version.err'
            $proc = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $outText = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
            $errText = (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            if ($proc.ExitCode -ne 0) { Fail "G1Wiggle.exe --version exited with code $($proc.ExitCode). stdout: $outText stderr: $errText" }
            Write-Output "::notice title=${label}::G1Wiggle.exe --version -> $("$outText".Trim())"
          } catch {
            Fail "$($_.Exception.Message)"
          }

      - name: Purge intermediate files
        shell: bash
        run: |
          rm -f release/*.blockmap release/*.yml release/*.yaml release/*.zip || true
          rm -rf release/*-unpacked release/mac-* release/win-* release/linux-* || true
      - name: Verify expected artifact
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/${{ matrix.artifact }})
          if [ ${#files[@]} -ne 1 ]; then
            echo "Expected artifact not found: ${{ matrix.artifact }}"
            ls -la release || true
            exit 1
          fi
          printf '%s\n' "${files[@]}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G1Wiggle-${{ matrix.os }}-${{ matrix.arch }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Build Summary
    needs: [build-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## G1Wiggle Build Matrix"
            echo
            echo "| OS | Arch | Artifact | Runner |"
            echo "| --- | --- | --- | --- |"
            echo "| macOS | x64 | G1Wiggle-*-x64.dmg | macos-latest |"
            echo "| macOS | arm64 | G1Wiggle-*-arm64.dmg | macos-latest |"
            echo "| macOS | universal | G1Wiggle-*-universal.dmg | macos-latest |"
            echo "| Windows | x64 | G1Wiggle-Setup-*-x64.exe | windows-latest |"
            echo "| Windows | ia32 | G1Wiggle-Setup-*-ia32.exe | windows-latest |"
            echo "| Windows | arm64 | G1Wiggle-Setup-*-arm64.exe | windows-latest |"
            echo "| Linux | x64 | G1Wiggle-*-x64.AppImage | ubuntu-latest |"
            echo "| Linux | arm64 | G1Wiggle-*-arm64.AppImage | ubuntu-24.04-arm |"
            echo "| Linux | armv7l | G1Wiggle-*-armv7l.AppImage | ubuntu-latest |"
          } >> "$GITHUB_STEP_SUMMARY"
